
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bouncing Box</title>
    <script src="jquery.min.js"></script>
    <style>
      .box {
        width: 70px;
        height: 70px;
        background-color: teal;
        font-size: 300%;
        text-align: center;
        user-select: none;
        display: block;
        position: absolute;
        top: 100px;
        left: 0px;
      }

      .board {
        height: 100vh;
      }
    </style>
  </head>

  <body class="board">
    <!-- HTML for the box -->
    <div class="box">?</div>

    <script>
      (function () {
        "use strict";
        /* global jQuery */

        //////////////////////////////////////////////////////////////////
        /////////////////// SETUP DO NOT DELETE //////////////////////////
        //////////////////////////////////////////////////////////////////

        var box = jQuery(".box"); // reference to the HTML .box element
        var board = jQuery(".board"); // reference to the HTML .board element
        var boardWidth = board.width(); // the maximum X-Coordinate of the screen
        var boardHeight = jQuery(window).height(); // the maximum Y-Coordinate of the screen

        // update the boardWidth variable when the window is resized
        jQuery(window).on("resize", function () {
          boardWidth = board.width();
          boardHeight = jQuery(window).height();
        });

        // Every 50 milliseconds, call the update Function (see below)
        // Challenge 6: store the interval so we can stop it later
        var interval = setInterval(update, 50);

        // Every time the box is clicked, call the handleBoxClick Function (see below)
        box.on("click", handleBoxClick);

        // Challenge 6: listen for clicks anywhere on the board (mis-clicks)
        board.on("click", handleBoardClick);

        // moves the Box to a new position on the screen along the X- and Y-Axis
        // Challenge 2: now moves vertically too
        function moveBoxTo(newPositionX, newPositionY) {
          box.css("left", newPositionX);
          box.css("top", newPositionY);
        }

        // changes the text displayed on the Box
        function changeBoxText(newText) {
          box.text(newText);
        }

        //////////////////////////////////////////////////////////////////
        /////////////////// YOUR CODE BELOW HERE /////////////////////////
        //////////////////////////////////////////////////////////////////

        // Variable declarations
        var positionX = 0;
        var positionY = 0;
        var points = 0;
        var speed = 10;      // horizontal speed
        var speedY = 7;      // Challenge 2: vertical speed
        var misClicks = 0;   // Challenge 6: track mis-clicks

        /**
         * This Function will be called 20 times/second.
         */
        function update() {
          // horizontal movement
          positionX = positionX + speed;
          if (positionX > boardWidth) {
            speed *= -1;
          }
          else if (positionX < 0) {
            speed *= -1;
          }

          // Challenge 2: vertical movement
          positionY = positionY + speedY;
          if (positionY > boardHeight) {
            speedY *= -1;
          }
          else if (positionY < 0) {
            speedY *= -1;
          }

          moveBoxTo(positionX, positionY);
        }

        /**
         * This Function will be called each time the box is clicked.
         */
        function handleBoxClick(event) {
          // Challenge 6: stop this click from also counting as a board mis-click
          event.stopPropagation();

          points++;
          changeBoxText(points);

          // Challenge 3: start at a random x-position each click
          positionX = Math.random() * boardWidth;

          // Challenge 5: speed up more every 3 clicks
          // base linear speed, plus an extra boost on every 3rd click
          speed = 3 * points + 10;
          if (points % 3 === 0) {
            speed += 15;
          }

          // Challenge 4: change to a random color each click
          box.css("background-color", getRandomColor());
        }

        /**
         * Challenge 6: called when the board (not the box) is clicked.
         * Counts mis-clicks and ends the game after 10.
         */
        function handleBoardClick() {
          misClicks++;
          if (misClicks >= 10) {
            endGame();
          }
        }

        /**
         * Challenge 4: returns a random rgb color string.
         */
        function getRandomColor() {
          var r = Math.floor(Math.random() * 256);
          var g = Math.floor(Math.random() * 256);
          var b = Math.floor(Math.random() * 256);
          return "rgb(" + r + ", " + g + ", " + b + ")";
        }

        /**
         * Challenge 6: stops the game by clearing the interval timer.
         */
        function endGame() {
          clearInterval(interval);
          changeBoxText("X");
        }

      })();
    </script>
  </body>
</html>
